name: daily-forecast
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy scipy arch
      - run: python forecast_today.py
      - run: python evaluate_log.py
      - run: python report_live.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results/ LIVE_STATUS.md
          git diff --cached --quiet || git commit -m "daily forecast $(date -u +%F)"
          git pull --rebase origin main || true
          git push
